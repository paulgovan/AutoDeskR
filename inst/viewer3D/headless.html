<!DOCTYPE html>
<!-- headless.html -->
  <head>
    <meta name="viewport" content="width=device-width, minimum-scale=1.0, initial-scale=1, user-scalable=no" />
    <style>
    .MyNavButton {
    position: absolute;
    top: 0;
    z-index: 1;
    padding: 1em;
    font-size: 1em;
    cursor: pointer;
    }
    #MyPrevButton {
    left: 0;
    }
    #MyNextButton {
    right: 0;
    }
    #MyViewerDiv {
    width: 100%;
    height: 100%;
    margin: 0;
    background-color: #F0F8FF;
    border: solid 1px #000000;
    }
</style>
    {{ headContent() }}
  </head>
  <body>
    <div id="MyViewerDiv"></div>
    <button id="MyPrevButton" class="MyNavButton">Previous</button>
    <button id="MyNextButton" class="MyNavButton">Next</button>

    <!-- The Viewer JS -->
    <script src="https://developer.api.autodesk.com/modelderivative/v2/viewers/7.*/viewer3D.min.js"></script>

    <!-- Developer JS -->
    <script>
      var viewer;
      var allViewables = [];
      var currentIndex = 0;

      var options = {
        env: 'AutodeskProduction',
        api: 'derivativeV2',
        getAccessToken: function(onGetAccessToken) {
          var accessToken = {{ accessToken }};
          var expireTimeSeconds = 60 * 30;
          onGetAccessToken(accessToken, expireTimeSeconds);
        }
      };

      var documentId = {{ documentID }};
      Autodesk.Viewing.Initializer(options, function onInitialized() {
        var container = document.getElementById('MyViewerDiv');
        viewer = new Autodesk.Viewing.Viewer3D(container);
        viewer.start();
        Autodesk.Viewing.Document.load(documentId, onDocumentLoaded, onDocumentLoadFailure);
      });

      function onDocumentLoaded(doc) {
        var root = doc.getRoot();
        var modelNodes  = root.search({ type: 'geometry', role: '3d' });
        var sheetNodes  = root.search({ type: 'geometry', role: '2d' });
        allViewables = modelNodes.concat(sheetNodes);
        if (allViewables.length) {
          viewer.loadDocumentNode(doc, allViewables[0]);
        }
        createCustomUI(doc);
      }

      function onDocumentLoadFailure(errorCode) {
        console.error('onDocumentLoadFailure() - errorCode:' + errorCode);
      }

      function createCustomUI(doc) {
        document.getElementById('MyPrevButton').addEventListener('click', function() {
          currentIndex = currentIndex === 0 ? (allViewables.length - 1) : (currentIndex - 1);
          viewer.loadDocumentNode(doc, allViewables[currentIndex]);
        });
        document.getElementById('MyNextButton').addEventListener('click', function() {
          currentIndex = (currentIndex + 1) % allViewables.length;
          viewer.loadDocumentNode(doc, allViewables[currentIndex]);
        });
      }
    </script>

  </body>
</html>
